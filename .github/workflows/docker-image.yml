name: Multiarch Build

on:
  workflow_dispatch:
  release:
    types: [published]
#  push:
#    branches: [ master ]
#    paths:
#      - 'src/build/**'
#  pull_request:
#    branches: [ master ]
#    paths:
#      - './.env'

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: all
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USER }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build & Push base image if needed
      run: |
        if docker pull "unzel/rutorrent-filemanager:base" > /dev/null 2>&1; then
          echo "Base image found, using cache."
          echo "build_base=false" >> "$GITHUB_ENV"
        else
          echo "Base image not found, will build it."
          echo "build_base=true" >> "$GITHUB_ENV"
          docker buildx build --platform linux/amd64,linux/386,linux/arm64,linux/arm/v7 --target=osbuild --push --tag=unzel/rutorrent-filemanager:base ./
        fi
    - name: Build the Docker image
      run: docker buildx build --platform linux/amd64,linux/386,linux/arm64,linux/arm/v7 --push --tag=unzel/rutorrent-filemanager:$(basename ${GITHUB_REF}) --tag=unzel/rutorrent-filemanager:latest ./

    - name: Extract release files from image
      run: |
        docker create --name extract-builder unzel/rutorrent-filemanager:latest
        docker cp extract-builder:/usr/src/app ./rutorrent
        docker rm extract-builder

    - name: Prepare release zip
      id: zip
      run: |
        zip_name="bundle_rutorrent_latest.zip"
        zip -r "$zip_name" rutorrent
        echo "zip_name=$zip_name" >> "$GITHUB_ENV"

    - name: Upload release asset
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.zip_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
